<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>2026학년도 1학기 신간도서</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Pretendard 폰트 -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      /* 🌼 봄 테마 색상 */
      --bg: #FEFCF6;
      --card-bg: #ffffff;
      --accent: #66BB6A;           
      --accent-hover: #FFD54F;     
      --accent-light: #F1F8E9;     
      --text-main: #4E443A;        
      --text-muted: #8D7B68;       
      --border: #e0e0e0;
    }
    
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }
    
    header {
      background-color: white;
      padding: 3rem 1rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      margin-bottom: 2.5rem;
      border-bottom: 6px solid var(--accent-hover);
    }
    header h1 {
      margin: 0;
      font-size: 2.4rem;
      color: #2E7D32;
      font-weight: 800;
      letter-spacing: -1px;
    }
    
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    .shelf-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .shelf-tab {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .shelf-tab span.count {
      font-size: 0.85rem;
      color: #999;
      font-weight: 400;
    }
    .shelf-tab:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
      color: #333;
    }
    .shelf-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 10px rgba(102, 187, 106, 0.3);
    }
    .shelf-tab.active span.count {
      color: rgba(255, 255, 255, 0.9);
    }

    .kdc-section {
      margin-bottom: 24px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      overflow: hidden;
    }
    .kdc-header {
      padding: 14px 18px;
      background: var(--accent-light);
      border-bottom: 1px solid #dcedc8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
    }
    .kdc-header:hover {
      background: #e8f5e9;
    }
    .kdc-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #2E7D32;
      font-size: 1.15rem;
    }
    .kdc-toggle {
      font-size: 0.9rem;
      color: var(--accent);
      width: 16px;
      text-align: center;
      transition: transform 0.3s;
    }
    .kdc-count {
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* === 📌 완벽 구현된 책 카드 그리드 === */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
      padding: 24px 20px;
    }
    
    .book-card {
      background: #fff;
      border-radius: 12px; /* 둥근 모서리 */
      border: 1px solid #e0e0e0; /* 연한 테두리 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.03); /* 은은한 그림자 */
      display: flex;
      flex-direction: column;
      overflow: hidden; /* ★ 핵심: 사진이 카드 모서리 밖으로 삐져나가지 않게 자름 */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      border-color: #ccc;
    }
    
    /* 📌 표지 영역 (여백 완전 제거!) */
    .book-cover-wrapper {
      position: relative;
      width: 100%;
      padding-top: 145%; /* 책 표지 비율에 맞게 높이 확보 */
      background: #fafafa;
      display: block;
      overflow: hidden; /* ★ 핵심: 확대 시 사진이 틀 밖으로 안 나가게 막음 */
      border-bottom: 1px solid #f0f0f0; /* 사진과 텍스트 사이 구분선 */
    }
    
    .book-cover-wrapper img {
      position: absolute;
      top: 0; 
      left: 0;
      width: 100%; 
      height: 100%;
      object-fit: cover; /* ★ 핵심: 상하좌우 빈틈없이 꽉 채우기 */
      transition: transform 0.3s ease; /* 부드러운 확대 애니메이션 */
    }
    .book-card:hover .book-cover-wrapper img {
      transform: scale(1.06); /* 마우스 올리면 사진만 스르륵 확대됨 */
    }
    
    /* 텍스트 영역 */
    .book-info {
      padding: 16px 14px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1; 
      justify-content: flex-start;
    }
    
    .book-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.35;
      word-break: keep-all; /* 긴 제목 여러 줄로 예쁘게 표시 */
    }
    
    .book-author {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 12px;
      line-height: 1.3;
      word-break: keep-all; 
    }
    
    .book-kdc {
      font-size: 0.85rem;
      color: #b0b0b0;
      margin-top: auto; /* KDC를 항상 맨 아래로 정렬 */
    }
    
    @media (max-width: 600px) {
      .book-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; padding: 16px; }
      header h1 { font-size: 1.9rem; }
    }
  </style>
</head>

`;
// =========================================================

const KDC_NAMES = {
  '000': '총류',
  '100': '철학',
  '200': '종교',
  '300': '사회과학',
  '400': '자연과학',
  '500': '기술과학',
  '600': '예술',
  '700': '언어',
  '800': '문학',
  '900': '역사'
};

function parseRawData(raw) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  const books = [];

  for (const line of lines) {
    const parts = line.split(/\t|\|/).map(p => p.trim());
    if (parts.length < 4) continue;

    const left   = parts[0]; 
    const title  = parts[1];
    const author = parts[2];
    const isbn   = parts[3];
    const image  = parts[4] || "";
    const link   = parts[5] || `https://search.reading.go.kr/search?isbn=${isbn}`;

    let shelf = "기타";
    if (left.trim().startsWith("[")) {
      const endBracket = left.indexOf("]");
      if (endBracket !== -1) {
        shelf = left.slice(left.indexOf("[") + 1, endBracket).trim(); 
      }
    }

    const afterBracket = left.includes("]") ? left.split("]")[1].trim() : left;

    let kdcCode = "000";
    const codeMatch = afterBracket.match(/(\d{3})/);
    if (codeMatch) {
      kdcCode = codeMatch[1];  
    }

    let kdcName = "";
    if (KDC_NAMES[kdcCode]) {
      kdcName = KDC_NAMES[kdcCode];  
    }

    books.push({
      shelf: shelf,      
      kdc: kdcCode,   
      kdcName: kdcName,    
      title: title,
      author: author,
      isbn: isbn,
      image: image,
      link: link
    });
  }

  return books;
}

function getShelves(data) {
  const map = new Map();
  data.forEach(book => {
    const key = book.shelf || "기타";
    if (!map.has(key)) map.set(key, 0);
    map.set(key, map.get(key) + 1);
  });
  
  let shelfArray = Array.from(map.entries()).map(([name, count]) => ({ name, count }));
  
  const order = ["일반책", "그림책", "참고도서", "교사용"];
  
  shelfArray.sort((a, b) => {
    let indexA = order.indexOf(a.name);
    let indexB = order.indexOf(b.name);
    if (indexA === -1) indexA = 999;
    if (indexB === -1) indexB = 999;
    return indexA - indexB;
  });

  return shelfArray;
}

const allBooks = parseRawData(rawData);

if (allBooks.length === 0) {
  document.getElementById("kdcContainer").innerHTML = '<p style="text-align:center; padding:100px; color:#8D7B68; font-size:1.1rem;">입력된 도서 데이터가 없습니다.<br>코드 양식을 다시 확인해주세요.</p>';
} else {
  const shelves = getShelves(allBooks);
  let currentShelf = shelves.length > 0 ? shelves[0].name : "기타";

  function renderShelfTabs() {
    const container = document.getElementById("shelfTabs");
    container.innerHTML = "";
    shelves.forEach((shelf) => {
      const btn = document.createElement("button");
      btn.className = "shelf-tab" + (shelf.name === currentShelf ? " active" : "");
      btn.innerHTML = `<span>${shelf.name}</span><span class="count">${shelf.count}권</span>`;
      
      btn.addEventListener("click", () => {
        currentShelf = shelf.name;
        renderShelfTabs();
        renderKdcSections();
      });
      container.appendChild(btn);
    });
  }

  function renderKdcSections() {
    const container = document.getElementById("kdcContainer");
    container.innerHTML = '';
    
    const filteredBooks = allBooks.filter(b => b.shelf === currentShelf);
    if (filteredBooks.length === 0) return;

    const group = {};
    filteredBooks.forEach(book => {
      const mainKdc = book.kdc.charAt(0) + "00"; 
      if (!group[mainKdc]) group[mainKdc] = [];
      group[mainKdc].push(book);
    });

    Object.keys(group).sort().forEach(code => {
      const booksInKdc = group[code];
      const section = document.createElement('div');
      section.className = 'kdc-section';
      
      const displayName = KDC_NAMES[code] || "분류";

      const header = document.createElement('div');
      header.className = 'kdc-header';
      header.innerHTML = `
        <div class="kdc-header-left">
          <span class="kdc-toggle">▼</span>
          <span>${code} ${displayName}</span>
        </div>
        <div class="kdc-count">${booksInKdc.length}권</div>
      `;

      const grid = document.createElement('div');
      grid.className = 'book-grid';
      
      booksInKdc.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        
        card.innerHTML = `
          <a href="${book.link}" target="_blank" class="book-cover-wrapper" title="${book.title} (클릭 시 이동)">
            <img src="${book.image}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/300x450/F1F8E9/66BB6A?text=No+Cover'">
          </a>
          <div class="book-info">
            <div class="book-title">${book.title}</div>
            <div class="book-author">${book.author}</div>
            <div class="book-kdc">${book.kdc} ${book.kdcName}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      header.addEventListener('click', () => {
        const isHidden = grid.style.display === "none";
        grid.style.display = isHidden ? "grid" : "none";
        header.querySelector('.kdc-toggle').textContent = isHidden ? "▼" : "▶";
        header.style.borderBottom = isHidden ? "1px solid var(--border)" : "none";
      });

      section.appendChild(header);
      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  renderShelfTabs();
  renderKdcSections();
}
</script>
